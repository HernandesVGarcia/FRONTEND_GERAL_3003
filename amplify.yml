version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/angular-google-maps/browser
    files:
      - "**/*"
      - "*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
      - pattern: '**/*'
        headers:
        - key: 'Content-Security-Policy'          
          value: "default-src 'self' https://15.229.242.119:3001 https://*.dmkd08pl2z96g.amplifyapp.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://code.jquery.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://code.jquery.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://15.229.242.119:3001 https://*.googleapis.com https://*.dmkd08pl2z96g.amplifyapp.com;"
        - key: 'Access-Control-Allow-Origin'
          value : '*'
        
  