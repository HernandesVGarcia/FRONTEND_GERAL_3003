version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/angular-google-maps/browser
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - dist/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Content-Security-Policy'
          value: "default-src 'self' https://54.207.232.168:3002 https://www.fiberworks-api.com:3002 https://*.d22rafepo5f9uu.amplifyapp.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://*.googleapis.com https://code.jquery.com https://*.code.jquery.com https://cdnjs.cloudflare.com https://*.cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://code.jquery.com https://*.code.jquery.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com https://*.fonts.gstatic.com; connect-src 'self' https://54.207.232.168:3002 https://www.fiberworks-api.com:3002 https://*.googleapis.com https://*.d22rafepo5f9uu.amplifyapp.com https://fiberworks-api.com:3002;"
        - key: 'Access-Control-Allow-Origin'
          value: '*'
          

  