<div class="modal-dialog modal-lg" #modalDialog>
  <div class="modal-content shadow-lg">
    <!-- Header -->
    <div class="modal-header bg-primary text-white" (mousedown)="onMouseDown($event)" style="cursor: move;">
      <h5 class="modal-title fw-bold">
        <mat-icon class="me-2">cell_tower</mat-icon>
        Plotar Estação
      </h5>
      <button type="button" class="btn-close btn-close-white" (click)="fechar()" aria-label="Close"></button>
    </div>

    <!-- Content -->
    <div class="modal-body">
      <div class="row g-3">
        <!-- Card Coordenadas -->
        <div class="col-12">
          <div class="card border-primary">
            <div class="card-header bg-light">
              <h6 class="mb-0 fw-semibold">Coordenadas do ponto clicado</h6>
            </div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">LAT</label>
                  <input type="text" class="form-control form-control-sm" readonly
                         [value]="data.lat != null ? data.lat.toString().replace('.', ',') : ''">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">LONG</label>
                  <input type="text" class="form-control form-control-sm" readonly
                         [value]="data.lng != null ? data.lng.toString().replace('.', ',') : ''">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card Informações da Estação -->
        <div class="col-12">
          <div class="card border-primary">
            <div class="card-header bg-light">
              <h6 class="mb-0 fw-semibold">Informações da Estação</h6>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">
                    Nome <span class="badge bg-danger ms-1">obrigatório</span>
                  </label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.nome" name="nome"
                         placeholder="Digite o nome da estação">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Logradouro</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.logradouro" name="logradouro"
                         placeholder="">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Complemento</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.complemento" name="complemento"
                         placeholder="">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Número</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.numero" name="numero"
                         placeholder="">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Bairro</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.bairro" name="bairro"
                         placeholder="">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Cidade</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.cidade" name="cidade"
                         placeholder="">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Telefone</label>
                  <input type="text" class="form-control form-control-sm" [(ngModel)]="form.telefone" name="telefone"
                         placeholder="">
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold">Observações</label>
                  <textarea class="form-control form-control-sm" [(ngModel)]="form.observacoes" name="observacoes"
                            rows="3" placeholder=""></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="fechar()" [disabled]="salvando">
        <span class="me-1">✕</span>
        Cancelar
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="plotar()" [disabled]="salvando || !form.nome.trim()">
        <span class="me-1" *ngIf="!salvando">✓</span>
        <span class="spinner-border spinner-border-sm me-1" *ngIf="salvando" role="status" aria-hidden="true"></span>
        {{ salvando ? 'Criando...' : 'Plotar Estação' }}
      </button>
    </div>
  </div>
</div>
