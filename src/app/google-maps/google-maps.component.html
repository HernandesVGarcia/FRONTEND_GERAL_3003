
<div class="map-shell">
  <google-map
    #mapContainer
    [center]="center"
    [zoom]="zoom"
    [options]="mapOptions"
    width="100%"
    height="100%"
    (mapInitialized)="onMapInitialized($event)">

    <!-- Marcador da localização atual do usuário -->
    <map-marker
    class="custom-gps-overlay"
    *ngIf="currentLocationMarker"
      [position]="currentLocationMarker"
      [options]="currentLocationMarkerOptions">
          
      
    
    </map-marker>

        

   

  </google-map>
</div>

  
 
<app-map-layers-drawer></app-map-layers-drawer>

  <app-map-search-buttons
    [caixas]="destino"
    [ctosSP]="destinoCTOSP"
    [carregandoPostesConcessionaria]="carregandoPostesConcessionaria"
    [postesConcessionariaDisponivel]="postesConcessionariaBotaoVisivel"
    (carregarPostesConcessionaria)="onCarregarPostesConcessionaria()">
  </app-map-search-buttons>  

<!-- 🗺️ NOVO: Botões de Tracer no canto superior -->
<app-map-tracer-buttons>
</app-map-tracer-buttons>

<!-- 🎯 Context Menu do Mapa -->
<app-map-context-menu
  [visible]="contextMenuVisible"
  [position]="contextMenuPosition"
  [contextType]="contextMenuType"
  (action)="onContextMenuAction($event)"
  (close)="hideContextMenu()">
</app-map-context-menu>

<!-- 🆕 Modal de Tipagem de Cabos -->
<app-tipagem-cabos-modal
  [visible]="tipagemCabosModalVisible"
  (caboTypeConfirmed)="onCaboTypeConfirmed($event)"
  (modalClosed)="fecharTipagemCabosModal()">
</app-tipagem-cabos-modal>

<app-tipagem-poligono
  [visible]="tipagemPoligonoModalVisible"
  (polygonConfirmed)="onPoligonoTipagemConfirmada($event)"
  (modalClosed)="fecharTipagemPoligonoModal()">
</app-tipagem-poligono>
