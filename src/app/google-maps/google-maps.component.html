  <google-map
    
    [center]="center"
    [zoom]="zoom"
    width="99%"
    height="90vh"
    (mapInitialized)="onMapInitialized($event)">

    <map-polyline 
    *ngFor="let pathj of polylinePaths6f"
    [path]="pathj"
    [options]="polylineOptions6f"
    ></map-polyline>

    <map-polyline 
    *ngFor="let pathj of polylinePaths8f"
    [path]="pathj"
    [options]="polylineOptions8f"
    ></map-polyline>

    <map-polyline 
    *ngFor="let path of polylinePaths12f"
    [path]="path"
    [options]="polylineOptions12f"
    ></map-polyline>
    
    <map-polyline
    *ngFor="let pathi of polylinePaths24f"
    [path]="pathi"
    [options]="polylineOptions24f">
    </map-polyline>

    <map-polyline
    *ngFor="let pathi of polylinePaths36f"
    [path]="pathi"
    [options]="polylineOptions36f">
    </map-polyline>

    <map-polyline
    *ngFor="let pathi of polylinePaths48f"
    [path]="pathi"
    [options]="polylineOptions48f">
    </map-polyline>

    <map-polyline
    *ngFor="let pathi of polylinePaths72f"
    [path]="pathi"
    [options]="polylineOptions72f">
    </map-polyline>

  </google-map>
