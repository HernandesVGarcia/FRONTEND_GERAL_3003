


  <google-map
    
    [center]="center"
    [zoom]="zoom"
    [options]="mapOptions"
    width="99%"
    height="90vh"
    (mapInitialized)="onMapInitialized($event)">

    <!-- Marcador da localização atual do usuário -->
    <map-marker
    class="custom-gps-overlay"
    *ngIf="currentLocationMarker"
      [position]="currentLocationMarker"
      [options]="currentLocationMarkerOptions">
          
      
    
    </map-marker>

        

   

  </google-map>

  
 
  <app-map-search-buttons>
  </app-map-search-buttons>  


<app-gojs-demo
    *ngIf="isGoJSModalOpen"
    [isOpen]="isGoJSModalOpen"
    (closeModal)="closeGoJSModal()">
  </app-gojs-demo>
