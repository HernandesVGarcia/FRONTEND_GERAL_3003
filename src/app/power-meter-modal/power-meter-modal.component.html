<div class="modal-dialog modal-dialog-centered power-meter-dialog-wrap" #modalDialog>
  <div class="modal-content shadow-lg">
    <div
      class="modal-header py-2 d-flex align-items-center flex-wrap gap-2 power-meter-modal-header border-bottom"
      (mousedown)="onMouseDown($event)"
    >
      <h5 class="modal-title mb-0 flex-grow-1 text-dark">{{ modalTitle }}</h5>
      <button type="button" class="btn btn-sm btn-outline-secondary power-meter-btn-fechar" (click)="fechar()">Fechar</button>
      <button type="button" class="btn-close power-meter-btn-close" (click)="fechar()" aria-label="Fechar"></button>
    </div>
    <div class="modal-body p-2 d-flex justify-content-center align-items-center bg-light">
      <div class="power-meter-frame">
        <div class="power-meter-image-wrap">
          <img
            [src]="imageSrc"
            [alt]="modalTitle"
            class="power-meter-img"
          />
          <textarea
            class="power-meter-lcd-overlay"
            [(ngModel)]="leiturasDbmText"
            rows="4"
            spellcheck="false"
            placeholder="&#10;--.-- dBm"
            (mousedown)="$event.stopPropagation()"
          ></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
