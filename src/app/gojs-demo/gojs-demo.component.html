    <div *ngIf="isOpen" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Diagrama de Conexões </h3>
          
          
        </div>
        <div class="gojs-container">
          <span class="close-button" (click)="close($event)">&times;</span>

          <div class="instruction-panel">
            
            
          </div>
          <div class="diagram-container">
            <div class="watermark-cover">
            <button class="export-pdf-button" (click)="exportarDiagramaParaPDF()">
            📄 Imprimir PDF
          </button>
        </div>

            <div #diagramDiv class="diagram-div"></div>
          </div>
          <div class="diagram-info" *ngIf="diagramInitialized">
            
          </div>
          <div class="diagram-error" *ngIf="initializationError">
            <p>Erro ao inicializar: {{initializationError}}</p>
          </div>
        </div>
      </div>
    </div>
