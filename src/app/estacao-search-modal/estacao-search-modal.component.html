<div class="modal-dialog modal-lg" #modalDialog>
  <div class="modal-content shadow-lg">
    <!-- Header -->
    <div class="modal-header bg-primary text-white" (mousedown)="onMouseDown($event)" style="cursor: move;">
      <h5 class="modal-title fw-bold">
        <mat-icon class="me-2">hub</mat-icon>
        Pesquisar Estação
      </h5>
      <button type="button" class="btn-close btn-close-white" (click)="onCancel()" aria-label="Close"></button>
    </div>

    <!-- Content -->
    <div class="modal-body">
      <p class="text-muted small mb-3">Pesquise estações por sigla ou endereço.</p>

      <!-- Card compacto: Filtros -->
      <div class="card card-compact mb-3 border-primary">
        <div class="card-body card-body-compact">
          <div class="row g-2 align-items-end">
            <div class="col">
              <label class="form-label fw-semibold form-label-compact">Sigla</label>
              <input type="text" class="form-control form-control-sm input-compact" [(ngModel)]="siglaFilter" name="siglaFilter"
                     placeholder="Digite a sigla da estação">
            </div>
            <div class="col">
              <label class="form-label fw-semibold form-label-compact">Endereço</label>
              <input type="text" class="form-control form-control-sm input-compact" [(ngModel)]="enderecoFilter" name="enderecoFilter"
                     placeholder="Digite o endereço">
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-outline-primary btn-sm" (click)="onBuscaCompleta()" [disabled]="isLoading">
                <mat-icon class="me-1" style="font-size: 18px; width: 18px; height: 18px;">search</mat-icon>
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Card: Grid de estações -->
      <div class="card border-primary">
        <div class="card-header bg-light">
          <h6 class="mb-0 fw-semibold">Estações encontradas</h6>
        </div>
        <div class="card-body p-0">
          <div *ngIf="isLoading" class="loading-container">
            <mat-icon class="loading-icon">hourglass_empty</mat-icon>
            <p>Carregando resultados...</p>
          </div>

          <div *ngIf="errorMessage" class="error-message p-3">
            <mat-icon color="warn">error</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>

          <div *ngIf="!isLoading && !errorMessage" class="flexgrid-wrapper">
            <div class="flexgrid-table">
              <div class="flexgrid-header">
                <div class="flexgrid-cell col-sigla">SIGLA</div>
                <div class="flexgrid-cell col-endereco">ENDEREÇO</div>
                <div class="flexgrid-cell col-id">ID</div>
              </div>
              <div *ngFor="let estacao of filteredData"
                   class="flexgrid-row"
                   [class.selected]="isSelected(estacao)"
                   (click)="onSelectEstacao(estacao)">
                <div class="flexgrid-cell col-sigla">{{ estacao.SIGLA }}</div>
                <div class="flexgrid-cell col-endereco">{{ estacao.ENDERECO }}</div>
                <div class="flexgrid-cell col-id">{{ estacao.ID_META }}</div>
              </div>
              <div *ngIf="filteredData.length === 0" class="flexgrid-empty">
                Nenhuma estação encontrada. Use os filtros para buscar.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer bg-light">
      <button type="button" class="btn btn-secondary btn-sm" (click)="onCancel()">
        <span class="me-1">✕</span>
        Cancelar
      </button>
    </div>
  </div>
</div>
