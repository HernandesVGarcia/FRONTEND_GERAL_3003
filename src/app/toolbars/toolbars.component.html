
<mat-toolbar color="primary">
  <span class="toolbar-brand">
    <!--<img src="/assets/logo fiber 2025.png"-->
    <img src="/assets/FIBERWORKS BRANCO VETOR.png"
     class="logo-img"
     width="200px"
     height="40px">
     <span class="brand-text-full"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span>
     <span class="brand-text-mobile">FIBER&nbsp;&nbsp;MOBILE</span>
  
  <span class="example-spacer"></span>


 <div class="toolbar-buttons">
  <button mat-raised-button 
          class="rel-btn"
          aria-label="Relatório geral do mapa"
          matTooltip="Relatório geral do mapa"
          matTooltipPosition="below"
          (click)="onOpenMapReport()">Rel</button>
  <button mat-raised-button 
          class="kml-btn" 
          aria-label="Exportar para KML" 
          matTooltip="Exportar para Google Earth (KML)" 
          matTooltipPosition="below"
          (click)="onExportKML()">KML</button>
  <button mat-raised-button 
          class="log-btn"
          aria-label="Log da cidade" 
          matTooltip="Log da cidade" 
          matTooltipPosition="below"
          (click)="abrirLogCidade()">Log</button>
