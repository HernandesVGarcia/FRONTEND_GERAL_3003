<div class="search-buttons-container">
  <!-- Pesquisar Caixa -->
  <div class="group">
    <button 
      class="map-search-button"
      (click)="onPesquisarCaixa()"
      aria-label="Pesquisar Caixa">
      <mat-icon>inventory_2</mat-icon>
    </button>
    <div class="tooltip-caixa">Pesquisar Caixa</div>
  </div>

  <!-- Pesquisar Cliente -->
  <div class="group">
    <button 
      class="map-search-button"
      (click)="onPesquisarCliente()"
      aria-label="Pesquisar Cliente">
      <mat-icon>person_search</mat-icon>
    </button>
    <div class="tooltip-cliente">Pesquisar Cliente</div>
  </div>

  <!-- Pesquisar Estação -->
  <div class="group">
    <button 
      class="map-search-button"
      (click)="onPesquisarEstacao()"
      aria-label="Pesquisar Estação">
      <mat-icon>cell_tower</mat-icon>
    </button>
    <div class="tooltip-estacao">Pesquisar Estação</div>
  </div>

  <!-- Pesquisar Logradouro -->
  <div class="group">
    <button 
      class="map-search-button"
      (click)="onPesquisarLogradouro()"
      aria-label="Pesquisar Logradouro">
      <mat-icon>location_on</mat-icon>
    </button>
    <div class="tooltip-logradouro">Pesquisar Logradouro</div>
  </div>

  <!-- Verificar Viabilidade -->
  <div class="group">
    <button 
      class="map-search-button viabilidade"
      (click)="onVerificarViabilidade()"
      aria-label="Verificar Viabilidade">
      <mat-icon>analytics</mat-icon>
    </button>
    <div class="tooltip-viabilidade">Verificar Viabilidade</div>
  </div>

  <!-- Postes Concessionária -->
  <div class="group" *ngIf="postesConcessionariaDisponivel">
    <button
      class="map-search-button postes-concessionaria"
      (click)="onPostesConcessionaria()"
      [disabled]="carregandoPostesConcessionaria"
      aria-label="Postes Concessionária">
      <mat-icon>electric_bolt</mat-icon>
    </button>
    <div class="tooltip-postes-concessionaria">Postes Concessionária</div>
  </div>
