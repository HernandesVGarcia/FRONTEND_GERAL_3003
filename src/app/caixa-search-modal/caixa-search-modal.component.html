<div class="modal-dialog modal-lg" #modalDialog>
  <div class="modal-content shadow-lg">
    <!-- Header -->
    <div class="modal-header bg-primary text-white" (mousedown)="onMouseDown($event)" style="cursor: move;">
      <h5 class="modal-title fw-bold">
        <mat-icon class="me-2">search</mat-icon>
        Pesquisar Caixa
      </h5>
      <button type="button" class="btn-close btn-close-white" (click)="onCancel()" aria-label="Close"></button>
    </div>

    <!-- Content -->
    <div class="modal-body">
      <p class="text-muted small mb-3">Pesquise caixas por número ou localização.</p>

      <!-- Card compacto: Filtros -->
      <div class="card card-compact mb-3 border-primary">
        <div class="card-body card-body-compact">
          <div class="row g-2 align-items-end">
            <div class="col">
              <label class="form-label fw-semibold form-label-compact">Número</label>
              <input type="text" class="form-control form-control-sm input-compact" [(ngModel)]="numeroFilter" name="numeroFilter"
                     placeholder="Digite o número da caixa">
            </div>
            <div class="col">
              <label class="form-label fw-semibold form-label-compact">Localização</label>
              <input type="text" class="form-control form-control-sm input-compact" [(ngModel)]="localizacaoFilter" name="localizacaoFilter"
                     placeholder="Digite a localização">
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-outline-primary btn-sm" (click)="onBuscaCompleta()" [disabled]="isLoading">
                <mat-icon class="me-1" style="font-size: 18px; width: 18px; height: 18px;">search</mat-icon>
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Card: Grid de caixas -->
      <div class="card border-primary">
        <div class="card-header bg-light">
          <h6 class="mb-0 fw-semibold">Caixas encontradas</h6>
        </div>
        <div class="card-body p-0">
          <div *ngIf="isLoading" class="loading-container">
            <mat-icon class="loading-icon">hourglass_empty</mat-icon>
            <p>Carregando resultados...</p>
          </div>

          <div *ngIf="errorMessage" class="error-message p-3">
            <mat-icon color="warn">error</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>

          <div *ngIf="!isLoading && !errorMessage" class="flexgrid-wrapper">
            <div class="flexgrid-table">
              <div class="flexgrid-header">
                <div class="flexgrid-cell col-numero">NUMERO</div>
                <div class="flexgrid-cell col-localizacao">LOCALIZAÇÃO</div>
                <div class="flexgrid-cell col-id">ID</div>
              </div>
              <div *ngFor="let caixa of filteredData"
                   class="flexgrid-row"
                   [class.selected]="isSelected(caixa)"
                   (click)="onSelectCaixa(caixa)">
                <div class="flexgrid-cell col-numero">{{ caixa.NUMERO }}</div>
                <div class="flexgrid-cell col-localizacao">{{ caixa.LOCALIZACAO }}</div>
                <div class="flexgrid-cell col-id">{{ caixa.ID_META }}</div>
              </div>
              <div *ngIf="filteredData.length === 0" class="flexgrid-empty">
                Nenhuma caixa encontrada. Use os filtros para buscar.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer bg-light">
      <button type="button" class="btn btn-secondary btn-sm" (click)="onCancel()">
        <span class="me-1">✕</span>
        Cancelar
      </button>
    </div>
  </div>
</div>
