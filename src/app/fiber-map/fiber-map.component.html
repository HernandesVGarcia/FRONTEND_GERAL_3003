
<!-- Único mapa para exibir ambos os tipos de caixas -->




<div class="container">
    <!-- Lista de Caixas CEO -->
    <app-lista-caixas (caixaSelecionada)="onCaixaSelecionada($event)"></app-lista-caixas>
    
    <!-- Lista de CTOs -->
    <app-lista-ctos (ctoSelecionada)="onCTOSelecionada($event)"></app-lista-ctos>


    <!-- Lista de Cabos6 -->
    <app-lista-cabos6f (caboSelecionada)="onCabos6fSelecionada($event)"></app-lista-cabos6f>


    <!-- Lista de Cabos8 -->
    <app-lista-cabos8f (caboSelecionada)="onCabos8fSelecionada($event)"></app-lista-cabos8f>


    <!-- Lista de Cabos 12-->
    <app-lista-cabos12f (caboSelecionada)="onCabosSelecionada($event)"></app-lista-cabos12f>
  

    <!-- Lista de Cabos24 -->
    <app-lista-cabos24f (caboSelecionada)="onCabos24fSelecionada($event)"></app-lista-cabos24f>
    
    
    
  </div>
  
  <app-google-maps 
  [destino]="caixasCEO" 
  [destinoCTO]="caixasCTO"
  [destinoCabos6f]="cabos6f"
  [destinoCabos8f]="cabos8f"
  [destinoCabos12f]="cabos12f"
  [destinoCabos24f]="cabos24f"
    > 
  </app-google-maps>
