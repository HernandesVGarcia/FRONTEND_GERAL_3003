<div class="modal-dialog modal-lg" #modalDialog>
  <div class="modal-content shadow-lg">
    <div
      class="modal-header bg-primary text-white"
      (mousedown)="onMouseDown($event)"
      style="cursor: move"
    >
      <h5 class="modal-title fw-bold">
        <mat-icon class="title-mat-icon" aria-hidden="true">my_location</mat-icon>
        Pesquisar coordenadas
      </h5>
      <button
        type="button"
        class="btn-close btn-close-white"
        (click)="onCancel()"
        aria-label="Fechar"
      ></button>
    </div>

    <div class="modal-body">
      <p class="text-muted small mb-3">
        Informe latitude e longitude (use ponto ou vírgula como separador decimal) e clique em
        <strong>Pesquisar</strong>.
      </p>

      <div *ngIf="errorMessage" class="error-message p-3" role="alert">
        <span class="error-glyph" aria-hidden="true">&#9888;</span>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="card card-compact mb-3 border-primary">
        <div class="card-body card-body-compact">
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label fw-semibold form-label-compact" for="latitudeInput"
                >Latitude</label
              >
              <input
                type="text"
                id="latitudeInput"
                class="form-control form-control-sm input-compact input-coord"
                name="latitudeTexto"
                [(ngModel)]="latitudeTexto"
                placeholder="Ex.: -16.168448"
                autocomplete="off"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold form-label-compact" for="longitudeInput"
                >Longitude</label
              >
              <input
                type="text"
                id="longitudeInput"
                class="form-control form-control-sm input-compact input-coord"
                name="longitudeTexto"
                [(ngModel)]="longitudeTexto"
                placeholder="Ex.: -42.275941"
                autocomplete="off"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer bg-light">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="onCancel()">
        <span class="me-1">✕</span>
        Cancelar
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="onPesquisar()">
        Pesquisar
      </button>
    </div>
  </div>
</div>
